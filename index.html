<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=1024">

<title>Home Dashboard</title>

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body {

  font-family: -apple-system, sans-serif;

  background: linear-gradient(135deg, #667eea, #764ba2);

  color: white;

  height: 100vh;

  padding: 20px;

  display: flex;

  flex-direction: column;

}

.header { text-align: center; margin-bottom: 20px; }

.time { font-size: 64px; font-weight: 300; }

.date { font-size: 20px; opacity: 0.9; margin-top: 8px; }

.content { display: flex; flex: 1; gap: 15px; margin-bottom: 20px; }

.weather, .bus {

  flex: 1;

  background: rgba(255,255,255,0.15);

  border-radius: 16px;

  padding: 20px;

}

.weather h2, .bus h2 { font-size: 20px; margin-bottom: 15px; }

.weather-data { font-size: 42px; font-weight: 700; margin-bottom: 8px; }

.weather-detail { font-size: 15px; opacity: 0.8; }

.bus-item {

  background: rgba(255,255,255,0.18);

  padding: 16px;

  border-radius: 12px;

  margin-bottom: 12px;

  border-left: 4px solid #ffd700;

}

.bus-route { font-size: 18px; font-weight: 600; margin-bottom: 8px; }

.bus-time { font-size: 26px; color: #ffd700; font-weight: 700; }

.footer { display: flex; gap: 12px; justify-content: center; }

.home-btn {

  background: white;

  color: #667eea;

  border: none;

  padding: 16px 26px;

  border-radius: 12px;

  font-size: 17px;

  font-weight: 600;

  cursor: pointer;

}

.home-btn.active { background: #4ade80; color: white; }

</style>

</head>

<body>

<div class="header">

  <div class="time" id="time">14:30</div>

  <div class="date" id="date">星期二，9 月 8 日</div>

</div>

<div class="content">

  <div class="weather">

    <h2>🌤️ 天氣</h2>

    <div class="weather-data" id="temp">--°C</div>

    <div class="weather-detail" id="condition">載入中...</div>

    <div class="weather-detail" id="weather-extra"></div>

  </div>

  <div class="bus">

    <h2>🚌 巴士到站</h2>

    <div class="bus-item">

      <div class="bus-route" id="bus1-route">25 號 往市中心</div>

      <div class="bus-time" id="bus1-time">載入中...</div>

    </div>

    <div class="bus-item">

      <div class="bus-route" id="bus2-route">26 號 往火車站</div>

      <div class="bus-time" id="bus2-time">載入中...</div>

    </div>

  </div>

</div>

<div class="footer">

  <button class="home-btn" id="btn-light1" onclick="toggleLight('light1')">💡 客廳</button>

  <button class="home-btn" id="btn-light2" onclick="toggleLight('light2')">💡 睡房</button>

  <button class="home-btn" onclick="toggleAC()">❄️ 冷氣</button>

  <button class="home-btn" onclick="location.reload()">🔄 重新整理</button>

</div>

<script>

// 時間

function updateTime() {

  const now = new Date();

  document.getElementById('time').textContent = 

    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  document.getElementById('date').textContent = weekdays[now.getDay()] + '，9 月 8 日';

}

setInterval(updateTime, 1000);

updateTime();



// 天氣

async function fetchWeather() {

  try {

    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.6309&longitude=1.2974&current_weather=true&timezone=auto');

    const data = await res.json();

    document.getElementById('temp').textContent = Math.round(data.current_weather.temperature) + '°C';

    const codes = {0:'☀️ 晴朗',1:'🌤️ 大部分晴朗',2:'⛅ 部分多雲',3:'☁️ 多雲',61:'🌧️ 細雨',63:'🌧️ 大雨',95:'⛈️ 雷暴'};
